server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      - docker: {}
  - job_name: myada_file_logs
    static_configs:
      - targets: [localhost]
        labels:
          job: myada_file_logs
          __path__: /var/log/myada/**/*.log
      - targets: [localhost]
        labels:
          job: myada_file_logs
          __path__: /host/myada/logs/**/*.log
    pipeline_stages:
      - regex:
          source: __path__
          expression: ".*/(?P<service>[^/]+)/app-.+\\.log$"
      - labels:
          service: service

