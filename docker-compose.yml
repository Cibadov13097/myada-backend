services:

  myada:
    image: postgres:16
    container_name: myada-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    volumes:
      - myada_postgres_data:/var/lib/postgresql/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: myada-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

  myada-redis:
    image: redis:7-alpine
    container_name: myada-redis
    ports:
      - "6379:6379"
    restart: always

  coturn:
    image: coturn/coturn:latest
    container_name: myada-coturn
    command:
      - "-n"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--realm=${TURN_REALM:-myada.local}"
      - "--listening-port=3478"
      - "--listening-ip=${TURN_LISTENING_IP:-0.0.0.0}"
      - "--relay-ip=${TURN_RELAY_IP:-0.0.0.0}"
      - "--external-ip=${TURN_EXTERNAL_IP:-13.60.31.141}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET:-myada-turn-secret-change-me}"
      - "--log-file=stdout"
      - "--simple-log"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
    restart: always

  authservice:
    build:
      context: .
      dockerfile: Services/AuthService/AuthService.Api/Dockerfile
    container_name: auth-service
    ports:
      - "5001:8080"
    volumes:
      - ./keys/private.pem:/keys/private.pem:ro
      - ./keys/public.pem:/keys/public.pem:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Develop: Host=myada;Port=5432;Database=AuthDb;Username=postgres;Password=123
      Jwt__PrivateKeyPath: /keys/private.pem
      Jwt__PublicKeyPath: /keys/public.pem
      SupportService__BaseUrl: http://myadasupportservice:8080
      SupportService__ProvisioningPath: /api/SupportStaffStatuses/internal/provision
      SupportService__ProvisioningKey: myada-internal-key
      NotificationService__BaseUrl: http://notificationservice:8080
      NotificationService__SendEmailPath: /api/v1/notifications/email
      NotificationService__RequestTimeoutSeconds: 10
      PasswordReset__ClientResetUrl: ${AUTH_PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
    depends_on:
      - myada
      - myada-redis
      - notificationservice
    restart: always

  lostfoundservice:
    build:
      context: .
      dockerfile: Services/LostFoundService/LostFoundService.API/Dockerfile
    container_name: lostfound-service
    ports:
      - "5002:8080"
    volumes:
      - ./keys/public.pem:/keys/public.pem:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Develop: Host=myada;Port=5432;Database=LostFoundDb;Username=postgres;Password=123
      Auth__JwksUrl: http://authservice:8080/.well-known/jwks.json
      Auth__PublicKeyPath: /keys/public.pem
      LocationBaseUrl__Url: http://locationservice:8080/
      RabbitMQ__Host: rabbitmq
      S3__BucketName: ${LOSTFOUND_S3_BUCKET_NAME:-myada-app}
      S3__Region: ${LOSTFOUND_S3_REGION:-eu-north-1}
      S3__AccessKey: ${LOSTFOUND_S3_ACCESS_KEY:?LOSTFOUND_S3_ACCESS_KEY_REQUIRED}
      S3__SecretKey: ${LOSTFOUND_S3_SECRET_KEY:?LOSTFOUND_S3_SECRET_KEY_REQUIRED}
      AWS_ACCESS_KEY_ID: ${LOSTFOUND_S3_ACCESS_KEY:?LOSTFOUND_S3_ACCESS_KEY_REQUIRED}
      AWS_SECRET_ACCESS_KEY: ${LOSTFOUND_S3_SECRET_KEY:?LOSTFOUND_S3_SECRET_KEY_REQUIRED}
      S3__ServiceUrl: ${LOSTFOUND_S3_SERVICE_URL:-}
      S3__ForcePathStyle: ${LOSTFOUND_S3_FORCE_PATH_STYLE:-false}
      S3__PublicBaseUrl: ${LOSTFOUND_S3_PUBLIC_BASE_URL:-}
      S3__KeyPrefix: ${LOSTFOUND_S3_KEY_PREFIX:-lost-and-found}
      S3__AutoCreateBucket: ${LOSTFOUND_S3_AUTO_CREATE_BUCKET:-false}
    depends_on:
      - authservice
      - myada
      - rabbitmq
    restart: always

  clubmanagementservice:
    build:
      context: .
      dockerfile: Services/ClubManagementService/ClubManagementService.API/Dockerfile
    container_name: clubmanagement-service
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Develop: Host=myada;Port=5432;Database=ClubDb;Username=postgres;Password=123
      Auth__JwksUrl: http://authservice:8080/.well-known/jwks.json
      Auth__Issuer: myada-auth
      Auth__Audience: myada-api
      RabbitMQ__Host: rabbitmq
      S3__BucketName: ${CLUB_S3_BUCKET_NAME:-myada-app}
      S3__Region: ${CLUB_S3_REGION:-eu-north-1}
      S3__AccessKey: ${CLUB_S3_ACCESS_KEY:?CLUB_S3_ACCESS_KEY_REQUIRED}
      S3__SecretKey: ${CLUB_S3_SECRET_KEY:?CLUB_S3_SECRET_KEY_REQUIRED}
      AWS_ACCESS_KEY_ID: ${CLUB_S3_ACCESS_KEY:?CLUB_S3_ACCESS_KEY_REQUIRED}
      AWS_SECRET_ACCESS_KEY: ${CLUB_S3_SECRET_KEY:?CLUB_S3_SECRET_KEY_REQUIRED}
      S3__ServiceUrl: ${CLUB_S3_SERVICE_URL:-}
      S3__ForcePathStyle: ${CLUB_S3_FORCE_PATH_STYLE:-false}
      S3__PublicBaseUrl: ${CLUB_S3_PUBLIC_BASE_URL:-}
      S3__KeyPrefix: ${CLUB_S3_KEY_PREFIX:-clubs}
      S3__AutoCreateBucket: ${CLUB_S3_AUTO_CREATE_BUCKET:-false}
      Tickets__SigningKey: dev-only-change-me-please-32chars-min!!
      Tickets__Issuer: myada-tickets
      Tickets__Audience: myada-scanner
    depends_on:
      - authservice
      - myada
      - rabbitmq
    restart: always

  notificationservice:
    build:
      context: .
      dockerfile: Services/NotificationService/NotificationService.Api/Dockerfile
    container_name: notification-service
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq
      ConnectionStrings__Develop: Host=myada;Port=5432;Database=NotificationDb;Username=postgres;Password=123
      SMTP__Host: ${NOTIFICATION_SMTP_HOST:-smtp.gmail.com}
      SMTP__Port: ${NOTIFICATION_SMTP_PORT:-587}
      SMTP__Username: ${NOTIFICATION_SMTP_USERNAME:-}
      SMTP__Password: ${NOTIFICATION_SMTP_PASSWORD:-}
      SMTP__FromEmail: ${NOTIFICATION_SMTP_FROM_EMAIL:-}
      SMTP__FromName: ${NOTIFICATION_SMTP_FROM_NAME:-MyADA Notifications}
      SMTP__EnableSsl: ${NOTIFICATION_SMTP_ENABLE_SSL:-true}
      SMTP__UseDefaultCredentials: ${NOTIFICATION_SMTP_USE_DEFAULT_CREDENTIALS:-false}
    depends_on:
      - rabbitmq
      - myada
    restart: always

  callservice:
    build:
      context: .
      dockerfile: Services/CallService/CallService.Api/Dockerfile
    container_name: call-service
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Auth__JwksUrl: http://authservice:8080/.well-known/jwks.json
      Auth__Issuer: myada-auth
      Auth__Audience: myada-api
      Redis__ConnectionString: myada-redis:6379
      Redis__ChannelPrefix: myada:call
      Call__InviteTimeoutSeconds: 30
      Call__DispatcherInboxPrefix: dispatcher-inbox-
      Turn__Enabled: true
      Turn__Urls__0: "stun:${TURN_PUBLIC_HOST:-13.60.31.141}:3478"
      Turn__Urls__1: "turn:${TURN_PUBLIC_HOST:-13.60.31.141}:3478?transport=udp"
      Turn__Urls__2: "turn:${TURN_PUBLIC_HOST:-13.60.31.141}:3478?transport=tcp"
      Turn__SharedSecret: ${TURN_SHARED_SECRET:-myada-turn-secret-change-me}
      Turn__CredentialTtlSeconds: 3600
    restart: always
    depends_on:
      - authservice
      - myada-redis
      - coturn


  locationservice:
    build:
      context: .
      dockerfile: Services/LocationService/LocationService.Api/Dockerfile
    container_name: location-service
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LocationService: Host=myada;Port=5432;Database=MyAdaLocationDb;Username=postgres;Password=123
      Auth__JwksUrl: http://authservice:8080/.well-known/jwks.json
    depends_on:
      - myada
      - authservice
    restart: always

  myadasupportservice:
    build:
      context: .
      dockerfile: Services/MyAdaSupportService/Dockerfile
    container_name: myada-support-service
    ports:
      - "5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=myada;Port=5432;Database=MyAdaSupport;Username=postgres;Password=123
      Auth__JwksUrl: http://authservice:8080/.well-known/jwks.json
      Auth__Issuer: myada-auth
      Auth__Audience: myada-api
      InternalAuth__ProvisioningKey: myada-internal-key
    depends_on:
      - myada
      - authservice
    restart: always

  myadaattandanceservice:
    build:
      context: ./Services/MyAdaAttendanceService
      dockerfile: Dockerfile
    container_name: myada-attandance-service
    ports:
      - "5009:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=myada;Port=5432;Database=my_ada_attendance_db;Username=postgres;Password=123
      Database__SeedLessonsIfEmpty: "true"
      AuthService__BaseUrl: http://authservice:8080/
      AuthService__RefreshPath: api/auth/refresh
      Authentication__RequireHttpsMetadata: "false"
    depends_on:
      - myada
      - authservice
    restart: always


  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - authservice
      - lostfoundservice
      - clubmanagementservice
      - notificationservice
      - callservice
      - locationservice
      - myadasupportservice
      - myadaattandanceservice
    restart: always

volumes:
  myada_postgres_data:

# Optional: attach API Gateway to an external Docker network (e.g. another Compose stack).
# 1) Create once: docker network create gateway-shared
# 2) Uncomment below and add under apigateway: networks: [default, gateway-shared]
# networks:
#   gateway-shared:
#     external: true
